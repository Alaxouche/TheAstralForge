name: CI & Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Thumbnails for images added since the last run (e.g. the weekly Discord gallery sync).
      # Up-to-date ones are skipped; the build falls back to originals if this step fails.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Thumbnails
        run: pip install --quiet pillow && python scripts/make-thumbs.py
        continue-on-error: true
      - name: Build site
        run: npm run build
      # Reported in the run log, never blocks a deploy (pull requests are gated by quality.yml)
      - name: Check internal links and images
        run: npm run check
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
