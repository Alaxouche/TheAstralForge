name: Quality Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build tooling
        run: npm ci

      # Runs here too so a breakage that only surfaces after indexing or
      # minification is caught on the PR rather than at deploy time.
      - name: Build search index and minify assets
        run: npm run post-build

      - name: Link Check
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,429
            --exclude-mail
            _site/**/*.html
