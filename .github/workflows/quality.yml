name: Quality Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --accept 200,206,403,429
            --exclude "^https?://(www\.)?(discord\.(com|gg)|patreon\.com|ko-fi\.com|youtube\.com|nexusmods\.com|next\.nexusmods\.com)"
            --exclude "ezojs\.com"
            "_site/**/*.html"
