# Community gallery shown on the homepage.
#
# Two ways to add entries:
#   1. By hand — copy a block below.
#   2. From Discord — run scripts/sync-discord-gallery.mjs (see the header
#      of that file), which appends new screenshots posted in the gallery
#      channels. The gallery-sync GitHub workflow can do this on a schedule.
#
# Fields:
#   title    short caption
#   author   Discord display name of whoever posted it
#   modlist  wunduniik | krentoraan | ghost-of-the-grid |
#            no-mans-sky-explorer | extrasolar-containment-protocol
#   image    path under /assets/ (synced files land in /assets/Images/community/)
#   date     YYYY-MM-DD
#   source   link to the original Discord message (optional)

