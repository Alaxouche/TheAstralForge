# Community gallery shown on the homepage.
#
# Two ways to add entries:
#   1. By hand — copy a block below.
#   2. From Discord — run scripts/sync-discord-gallery.mjs (see the header
#      of that file), which appends new screenshots posted in the gallery
#      channels. The gallery-sync GitHub workflow can do this on a schedule.
