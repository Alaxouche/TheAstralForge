# Site FAQ (/faq/ and /hub/). Each entry: question, answer (Markdown), question_fr, answer_fr, tags, tags_fr.
- id: install-speed
  question: "Why does Wabbajack take so long?"
  answer: |
    Mostly because of Nexus Mods. Without Premium, Nexus limits each download to about 3 MB/s (1.5 MB/s with an ad blocker) and asks for one click per file. With Premium there is no limit and no click. Then the install itself depends on your drive: an NVMe SSD is much faster than a hard drive.

    Each list's **Wabbajack Installation** page has an estimator: pick your connection, Premium or not, and your drive, and it gives you the time for that list.
  question_fr: "Pourquoi Wabbajack prend-il autant de temps ?"
  answer_fr: |
    Surtout à cause de Nexus Mods. Sans Premium, Nexus limite chaque téléchargement à environ 3 Mo/s (1,5 Mo/s avec un bloqueur de pub) et demande un clic par fichier. Avec Premium, il n'y a ni limite ni clic. Ensuite, l'installation dépend de votre disque : un SSD NVMe est bien plus rapide qu'un disque dur.

    La page **Installation avec Wabbajack** de chaque liste a un estimateur : choisissez votre connexion, Premium ou non, et votre disque, il donne la durée pour cette liste.
  tags: [Installation, Wabbajack]
  tags_fr: [Installation, Wabbajack]
- id: premium
  question: "Do I need Nexus Premium?"
  answer: "No. Every list installs with a free Nexus account. Without Premium you click a download button for each Nexus file and downloads are slower, so a large list takes much longer."
  question_fr: "Faut-il Nexus Premium ?"
  answer_fr: "Non. Chaque liste s'installe avec un compte Nexus gratuit. Sans Premium, vous cliquez sur un bouton de téléchargement pour chaque fichier Nexus et les téléchargements sont plus lents : une grosse liste prend donc beaucoup plus de temps."
  tags: [Installation, Nexus]
  tags_fr: [Installation, Nexus]
- id: crashes
  question: "My game crashes. What should I do?"
  answer: |
    Open the **Troubleshooting** page of your list. It asks two or three questions to find the fix, explains where the crash log is, and reads the log for you: paste it and it lists the mods it names.

    - [Wunduniik](/wunduniik/troubleshooting/)
    - [Krentoraan](/krentoraan/troubleshooting/)
    - [Ghost of the Grid](/ghost-of-the-grid/troubleshooting/)
    - [No Man's Sky - Explorer](/no-mans-sky-explorer/troubleshooting/)
    - [Extrasolar Containment Protocol](/extrasolar-containment-protocol/troubleshooting/)
  question_fr: "Mon jeu plante. Que faire ?"
  answer_fr: |
    Ouvrez la page **Dépannage** de votre liste. Elle pose deux ou trois questions pour trouver la solution, explique où se trouve le journal de crash et le lit pour vous : collez-le et elle liste les mods qu'il cite.

    - [Wunduniik](/wunduniik/troubleshooting/)
    - [Krentoraan](/krentoraan/troubleshooting/)
    - [Ghost of the Grid](/ghost-of-the-grid/troubleshooting/)
    - [No Man's Sky - Explorer](/no-mans-sky-explorer/troubleshooting/)
    - [Extrasolar Containment Protocol](/extrasolar-containment-protocol/troubleshooting/)
  tags: [Stability, Troubleshooting]
  tags_fr: [Stabilité, Dépannage]
- id: update
  question: "How do I update a list without losing my saves?"
  answer: |
    Each list has an **Updating the List** page in its installation guide. It says what to back up, how to run the update in Wabbajack, and what the update keeps: saves, the downloads folder and mods you renamed with `[NoDelete]`. Everything else in the list folder is replaced.

    - [Wunduniik](/wunduniik/installation-guide/updating/)
    - [Krentoraan](/krentoraan/installation-guide/updating/)
    - [Ghost of the Grid](/ghost-of-the-grid/installation-guide/updating/)
    - [No Man's Sky - Explorer](/no-mans-sky-explorer/installation-guide/updating/)
    - [Extrasolar Containment Protocol](/extrasolar-containment-protocol/installation-guide/updating/)
  question_fr: "Comment mettre à jour une liste sans perdre mes sauvegardes ?"
  answer_fr: |
    Chaque liste a une page **Mettre à jour la liste** dans son guide d'installation. Elle dit quoi sauvegarder, comment lancer la mise à jour dans Wabbajack et ce que la mise à jour garde : les sauvegardes, le dossier de téléchargements et les mods renommés avec `[NoDelete]`. Tout le reste du dossier de la liste est remplacé.

    - [Wunduniik](/wunduniik/installation-guide/updating/)
    - [Krentoraan](/krentoraan/installation-guide/updating/)
    - [Ghost of the Grid](/ghost-of-the-grid/installation-guide/updating/)
    - [No Man's Sky - Explorer](/no-mans-sky-explorer/installation-guide/updating/)
    - [Extrasolar Containment Protocol](/extrasolar-containment-protocol/installation-guide/updating/)
  tags: [Updates]
  tags_fr: [Mises à jour]
