- id: reporting-bugs
  question: "How should I report a bug?"
  answer: "Use the [bug report form](/report-a-bug/): it goes to the support channel on Discord. Say which list and version you play, what you did just before, and add the crash log as a link. You can also post directly in the support channel of the [Discord server](https://discord.gg/vKuB7nazBk)."
  question_fr: "Comment signaler un bug ?"
  answer_fr: "Utilisez le [formulaire de signalement](/report-a-bug/) : il arrive dans le canal de support du Discord. Indiquez la liste et la version que vous jouez, ce que vous faisiez juste avant, et ajoutez le journal de crash sous forme de lien. Vous pouvez aussi poster directement dans le canal de support du [serveur Discord](https://discord.gg/vKuB7nazBk)."
  tags: [Support]
  tags_fr: [Assistance]
- id: update-frequency
  question: "How often are the lists updated?"
  answer: "There is no fixed schedule: a list is updated when its game or its mods need it. The footer of every page shows the current version of each list and how long ago it came out, and each list's changelog says what changed and whether you need a new save."
  question_fr: "À quelle fréquence les listes sont-elles mises à jour ?"
  answer_fr: "Il n'y a pas de rythme fixe : une liste est mise à jour quand son jeu ou ses mods le demandent. Le pied de chaque page montre la version actuelle de chaque liste et son ancienneté, et le changelog de chaque liste dit ce qui a changé et s'il faut une nouvelle partie."
  tags: [Changelog]
  tags_fr: [Changelog]
