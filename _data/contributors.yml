# "Why contribute" repeats what the Patreon tiers below give: keep both in step.
benefits:
  - A Discord role and its advantages
  - Your mod suggestions are looked at first
  - Your name in the in-game credits menu and on this site
  - "At Daedric Prince: a weapon named after you in Wunduniik"
benefits_fr:
  - Un rôle Discord et ses avantages
  - Vos suggestions de mods passent en premier
  - Votre nom dans le menu des crédits du jeu et sur ce site
  - "Au niveau Daedric Prince : une arme à votre nom dans Wunduniik"

impact:
  - Hardware and testing resources for stable builds
  - Time for bug fixing, balancing, and compatibility checks
  - Documentation, guides, and installation support
  - Asset licensing and tooling for better visuals
impact_fr:
  - Du matériel et des moyens de test pour des versions stables
  - Du temps pour corriger les bugs, équilibrer et vérifier la compatibilité
  - La documentation, les guides et l'aide à l'installation
  - Des licences et des outils pour de meilleurs visuels

tiers:
  - name: "Jarl"
    amount: "$1.50 / month (+VAT)"
    amount_fr: "1,50 $ / mois (+TVA)"
    perks:
      - Discord role and advantages
      - Priority suggestions for mods
      - Listed in the credits menu and pages
      - Access to Discord
    perks_fr:
      - Rôle et avantages sur Discord
      - Suggestions de mods prioritaires
      - Nom dans le menu des crédits et sur les pages
      - Accès au Discord
  - name: "Dragon Priest"
    same_as: "Jarl"
    amount: "$3 / month (+VAT)"
    amount_fr: "3 $ / mois (+TVA)"
    perks:
      - Discord role and advantages
      - Priority suggestions for mods
      - Listed in the credits menu and pages
      - Access to Discord
    perks_fr:
      - Rôle et avantages sur Discord
      - Suggestions de mods prioritaires
      - Nom dans le menu des crédits et sur les pages
      - Accès au Discord
  - name: "Greybeard"
    same_as: "Jarl"
    amount: "$6 / month (+VAT)"
    amount_fr: "6 $ / mois (+TVA)"
    perks:
      - Discord role and advantages
      - Priority suggestions for mods
      - Listed in the credits menu and pages
      - Access to Discord
    perks_fr:
      - Rôle et avantages sur Discord
      - Suggestions de mods prioritaires
      - Nom dans le menu des crédits et sur les pages
      - Accès au Discord
  - name: "Daedric Prince"
    amount: "$10 / month (+VAT)"
    amount_fr: "10 $ / mois (+TVA)"
    perks:
      - Custom weapon named after you integrated into Wunduniik
      - Discord role and advantages
      - Listed in the credits menu and pages
      - Priority suggestions for mods
      - Access to Discord
    perks_fr:
      - Une arme à votre nom intégrée à Wunduniik
      - Rôle et avantages sur Discord
      - Nom dans le menu des crédits et sur les pages
      - Suggestions de mods prioritaires
      - Accès au Discord

