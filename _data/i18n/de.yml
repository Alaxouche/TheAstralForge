# Deutsch (de) UI strings for The Astral Forge.
#
# Single source of truth for interface text. site.js inlines these into the JS
# bundle at build time as window.SG_I18N, and Liquid can read the same values
# through site.data.i18n — so a string is written once, not once per system.
#
# English is the reference. A key missing from another language falls back to
# en.yml, so a partial translation is fine and never leaves a blank on the page.
#
# Keys are grouped by prefix: nav.*, home.*, readme.*, faq.*, contrib.*, ...

