# Keyboard maps drawn on the game guide Controls pages (filter `keymap`, scripts/visuals.mjs).
# Same content as the tables of each page: update both together.
# keys: Id: [category, English label, French label], or a list of those when a key does several things.
# Key ids: letters, digits, F1..F12, Esc, "`", Backspace, Tab, Caps, Enter, LShift, RShift, LCtrl, RCtrl, LAlt, RAlt,
# Space, PrtSc, ScrLk, Pause, Ins, Home, PgUp, Del, End, PgDn, Up, Down, Left, Right, and the punctuation keys.
# mouse: Left, Right, Middle, Side.
# A long word on a 1-unit key can carry a soft hyphen (U+00AD) where it may break.

wunduniik:
