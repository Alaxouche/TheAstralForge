# Advertising configuration.
#
# Nothing loads until BOTH of these are true:
#   1. enabled is true and script_src / zone are filled in below;
#   2. the visitor has actively accepted in the consent banner.
# Leaving enabled at false is the kill switch — no third-party request is made
# and the consent banner does not appear at all.
#
# ── Filling this in ────────────────────────────────────────────────────
# Monetag gives you a snippet that looks like:
#
#   <script src="https://xxxxxx.com/88/tag.min.js" data-zone="1234567"
#           async data-cfasync="false"></script>
#
# Copy the two values out of it — the src URL and the data-zone number. The
# host in that URL is specific to your account, which is why it is not
# hardcoded anywhere in this repo.
#
# ── Before going live ──────────────────────────────────────────────────
# - ads.txt is NOT required by Monetag: they verify by file upload or meta
#   tag, and this site was verified with no ads.txt at all. It only becomes
#   mandatory if you run AdSense alongside. See the notes in /ads.txt.
# - Only the Multitag / in-page formats are wired here. Push notifications
#   would need Monetag's service worker merged into the site's own sw.js
#   (they would otherwise collide at /sw.js); popunders and interstitials
#   are not wired on purpose — they break the Lighthouse gates in
#   lighthouserc.json.

monetag:
  enabled: true
  script_src: "https://nap5k.com/tag.min.js"
  zone: "10594421"

# Consent banner. Shown only when an ad provider above is enabled.
consent:
  # Where the visitor can read what is collected. Leave blank to hide the link.
  policy_url: ""
