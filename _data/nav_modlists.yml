# Modlists menu in the site header.
#
# This used to be five near-identical blocks of hand-written HTML in
# _includes/skyground_header.html — adding a list meant copying twenty lines and
# hoping nothing was missed. Add a modlist here instead and the menu follows.
#
#   id     used to build the submenu's element id, so keep it URL-safe
#   name   shown in the menu (a proper noun, so it is not translated)
#   game   platform shown on the hub card
#   card   hub card image (an 800w derivative — the card renders at 420px)
#   base   URL prefix, with trailing slash
#   links  path is appended to base; i18n is the key used by i18n.js

modlists:
  - id: wunduniik
    name: Wunduniik
    game: "Skyrim SE"
    card: "/assets/thumbs/Skyrim/enb_2026-2-28_18-36-11_274-800.webp"
    base: /wunduniik/
    links:
      - { label: Overview,           path: "",                   i18n: nav.overview }
      - { label: Installation Guide, path: "installation-guide/", i18n: nav.install }
      - { label: Changelog,          path: "changelog/",          i18n: nav.changelog }
      - { label: Known Issues,       path: "known-issues/",       i18n: nav.known_issues }
      - { label: Load Order,         path: "loadorder/",          i18n: nav.load_order }

  - id: krentoraan
