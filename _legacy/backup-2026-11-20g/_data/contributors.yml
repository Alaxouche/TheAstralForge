benefits:
  - Early access to previews and roadmap updates
  - Priority support on Discord for installation and troubleshooting
  - Your name listed as a supporter on the site
  - Help decide future list improvements and features
benefits_fr:
  - Accès anticipé aux aperçus et aux nouvelles de la feuille de route
  - Aide prioritaire sur Discord pour l'installation et le dépannage
  - Votre nom dans la liste des soutiens sur le site
  - Votre avis compte sur les prochaines améliorations des listes

impact:
  - Hardware and testing resources for stable builds
  - Time for bug fixing, balancing, and compatibility checks
  - Documentation, guides, and installation support
  - Asset licensing and tooling for better visuals
impact_fr:
  - Du matériel et des moyens de test pour des versions stables
  - Du temps pour corriger les bugs, équilibrer et vérifier la compatibilité
  - La documentation, les guides et l'aide à l'installation
  - Des licences et des outils pour de meilleurs visuels

